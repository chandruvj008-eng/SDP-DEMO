<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDP DEMO</title>
</head>
<body background="71121-River-Winter-Forest-SnowArtistic-Sunrise-HD-Wallpaper.jpg">
  <h1>ENTER YOUR CREDENCIALS</h1>

  <form action="accepted.html" method="get">
    <p>
      <label for="username">ENTER YOUR USERNAME</label><br>
      <input id="username" name="username" type="text" required>
    </p>

    <p>
      <label for="password">PASSWORD</label><br>
      <input id="password" name="password" type="password" required>
    </p>

    <fieldset>
      <legend>CSE ACADEMIC INTERESTS</legend>
      <label><input type="checkbox" name="interests" value="programming"> Programming</label><br>
      <label><input type="checkbox" name="interests" value="data-structures"> Data Structures and Algorithms</label><br>
      <label><input type="checkbox" name="interests" value="web-development"> Web Development</label><br>
      <label><input type="checkbox" name="interests" value="artificial-intelligence"> Artificial Intelligence and Machine Learning</label><br>
      <label><input type="checkbox" name="interests" value="cybersecurity"> Cybersecurity</label>
    </fieldset>

    <button type="submit">SUBMIT</button>
  </form>
</body>
</html>
