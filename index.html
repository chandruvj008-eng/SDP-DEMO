<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDP DEMO</title>
</head>
<body background="71121-River-Winter-Forest-SnowArtistic-Sunrise-HD-Wallpaper.jpg">
  <h1>ENTER YOUR CREDENCIALS</h1>

  <form action="accepted.html" method="get">

      <label for="username">ENTER YOUR USERNAME</label><br>

</html>
